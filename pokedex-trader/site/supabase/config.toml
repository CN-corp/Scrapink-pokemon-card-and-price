# Réglages des fonctions Edge pour la CLI Supabase.
# Le webhook Stripe n'envoie pas de jeton Supabase : la vérification JWT doit être désactivée
# pour lui seul (sa sécurité repose sur la signature Stripe, vérifiée dans le code).
[functions.create-checkout]
verify_jwt = true

[functions.customer-portal]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false
