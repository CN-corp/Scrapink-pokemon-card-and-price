server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Fichiers techniques jamais publiés (équivalent de site/_redirects)
    location ~ ^/(supabase|tools)(/|$) { return 404; }
    location ~ ^/(README\.md|_headers|_redirects|preview.*\.html)$ { return 404; }
    location ~ /\. { return 404; }

    # HTML et config.js changent à chaque mise à jour : toujours revérifiés
    location = /index.html       { include conf.d/security-headers.inc; add_header Cache-Control "no-cache"; }
    location = /assets/config.js { include conf.d/security-headers.inc; add_header Cache-Control "no-cache"; }
    location /assets/            { include conf.d/security-headers.inc; add_header Cache-Control "public, max-age=3600"; }

    location / {
        include conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
